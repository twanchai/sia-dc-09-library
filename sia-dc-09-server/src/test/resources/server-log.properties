# SIA DC-09 Server – incoming message file logger
# Set to true to record every incoming raw DC-09 frame to a file for later playback.
message.log.enabled=true

# Path to the log file (relative to the working directory, or absolute).
message.log.file=incoming-messages.log

# Maximum log file size in megabytes before the file is rotated (0 = no rotation).
message.log.max.mb=10
